name: Deploy

# Builds apps/web as a Cloudflare Worker (OpenNext) and deploys it as claw-master-dashboard. It also
# deletes claude-master-dashboard, the Worker's name before the rename (ejc3/aws#415), once ejc3/aws
# has turned that Worker's URL off.
# Cloudflare Access gates the Worker (an Access application with the Worker as its destination,
# managed in ejc3/aws), and the app refuses any request without a valid Access assertion.
#
# The deploy token lives in the "production" environment, whose deployment-branch policy admits
# main only, so no other branch, workflow or fork can read it. This workflow runs only on a push
# to main or by hand on main; never on pull_request, pull_request_target or workflow_run. Every
# action is pinned to a commit: a moved tag must not run on the runner that later holds the token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue behind each other and are never cancelled half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    # GitHub-hosted: this repository is public, so it never uses self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same gate as CI, on the commit being deployed: a red commit never deploys.
      - name: Check
        run: pnpm exec biome ci . && pnpm typecheck && pnpm test
      - name: Build the Worker
        run: pnpm --filter web cf:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # OpenNext embeds apps/web/.env* files in the Worker; CI has none, and none may appear.
      - name: Nothing from an env file is embedded
        run: |
          node -e "import('./apps/web/.open-next/cloudflare/next-env.mjs').then((m) => { const p = m.production ?? {}; if (Object.keys(p).length) { console.error('embedded env:', Object.keys(p)); process.exit(1) } })"
      - name: Deploy claw-master-dashboard
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_CONFIG_KV_ID: ${{ vars.DASHBOARD_CONFIG_KV_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Not deployed: the production environment has no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable yet (docs/deploy.md)."
            echo "### Not deployed: no deploy credentials in the production environment yet" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The allowlist's namespace (ejc3/aws writes the list into it). Required: without the
          # binding the Worker admits nobody, so a missing id fails the deploy and the running
          # version stays.
          placeholder=00000000000000000000000000000000
          if ! printf '%s' "$DASHBOARD_CONFIG_KV_ID" | grep -Eqx '[0-9a-f]{32}' || [ "$DASHBOARD_CONFIG_KV_ID" = "$placeholder" ]; then
            echo "::error::The production environment's DASHBOARD_CONFIG_KV_ID variable is missing or not a KV namespace id (docs/deploy.md)."
            exit 1
          fi
          sed -i "s/\"id\": \"$placeholder\"/\"id\": \"$DASHBOARD_CONFIG_KV_ID\"/" wrangler.jsonc
          grep -q "\"id\": \"$DASHBOARD_CONFIG_KV_ID\"" wrangler.jsonc
          pnpm exec wrangler deploy
      # The retired Worker goes only after ejc3/aws has turned its URL off and removed its Access
      # application in the same apply: deleting it first would leave Terraform state naming a Worker
      # that is gone. Until then this step says why it waits; after, it finds nothing to delete.
      - name: Delete the retired claude-master-dashboard Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OLD: claude-master-dashboard
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || exit 0
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$OLD"
          auth() { printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN"; }
          code=$(auth | curl -s -o subdomain.json -w '%{http_code}' -H @- "$api/subdomain")
          if [ "$code" = 404 ]; then
            echo "$OLD is already deleted."
            exit 0
          fi
          if [ "$code" != 200 ]; then
            echo "::error::Could not read $OLD's URL switches (HTTP $code)."
            exit 1
          fi
          if [ "$(jq -r '.result.enabled or .result.previews_enabled' subdomain.json)" != false ]; then
            echo "::notice::$OLD still has a URL on; it is deleted once ejc3/aws turns it off (#415)."
            exit 0
          fi
          auth | curl -sf -X DELETE -H @- "$api?force=true" > /dev/null
          echo "Deleted $OLD."
          echo "### Deleted the retired Worker $OLD" >> "$GITHUB_STEP_SUMMARY"
      # The Worker's id (not its version) is what the Access application in ejc3/aws names; it
      # exists only after the first deploy. Metadata, not a credential: printed for that step.
      - name: Report the Worker id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || exit 0
          workers=$(printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" |
            curl -sf -H @- "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers?per_page=100")
          id=$(printf '%s' "$workers" | jq -r '.result[] | select(.name == "claw-master-dashboard") | .id')
          echo "Worker claw-master-dashboard id: ${id:-not found}"
          echo "Worker claw-master-dashboard id: \`${id:-not found}\`" >> "$GITHUB_STEP_SUMMARY"

